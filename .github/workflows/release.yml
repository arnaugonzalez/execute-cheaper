name: Release
# Push a tag like v0.1.0. PyPI accepts the upload through Trusted Publishing (no token stored here):
# the project must list this repo, this workflow file and the `pypi` environment as a trusted publisher.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read  # default for every job; the two below widen only what they need

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Tag, package version and changelog agree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(python -c 'import execute_cheaper; print(execute_cheaper.__version__)')"
          [ "$tag" = "$version" ] || { echo "::error::tag v$tag but execute_cheaper.__version__ is $version"; exit 1; }
          grep -qE "^## $version — [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md \
            || { echo "::error::CHANGELOG.md needs a dated '## $version — YYYY-MM-DD' heading"; exit 1; }
      - name: Tests
        run: |
          git config --global user.email ci@example.com && git config --global user.name ci
          python -m unittest -q tests.test_execute_cheaper
      - name: Build and check
        run: |
          pipx run build
          pipx run twine check --strict dist/*
      - name: Release notes from CHANGELOG
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## "v" " {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          test -s notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            dist/
            notes.md

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/execute-cheaper/
    permissions:
      id-token: write  # OIDC token that PyPI Trusted Publishing exchanges for a short-lived upload token
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the GitHub release and attach dist/
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release
      - run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
