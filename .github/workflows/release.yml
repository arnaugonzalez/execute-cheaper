name: Release
# Push a tag like v0.1.0. PyPI accepts the upload through Trusted Publishing (no token stored here):
# the project must list this repo, this workflow file and the `pypi` environment as a trusted publisher.
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag, package version and changelog agree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(python -c 'import execute_cheaper; print(execute_cheaper.__version__)')"
          [ "$tag" = "$version" ] || { echo "::error::tag v$tag but execute_cheaper.__version__ is $version"; exit 1; }
          grep -qE "^## $version — [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md \
            || { echo "::error::CHANGELOG.md needs a dated '## $version — YYYY-MM-DD' heading"; exit 1; }
      - name: Tests
        run: |
          git config --global user.email ci@example.com && git config --global user.name ci
          python -m unittest -q tests.test_execute_cheaper
      - name: Build and check
        run: |
          pipx run build
          pipx run twine check --strict dist/*
      - name: Release notes from CHANGELOG
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## "v" " {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          test -s notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            dist/
            notes.md

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/execute-cheaper/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
      - run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
