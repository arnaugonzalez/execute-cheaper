name: CI
on:
  push:
  pull_request:
permissions:
  contents: read  # CI only reads the code

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Configure git identity for test repos
        run: git config --global user.email ci@example.com && git config --global user.name ci
      - run: pipx run ruff check .
      - run: python -m unittest -v tests.test_execute_cheaper
      - name: Smoke test the installed CLI
        run: |
          pip install .
          execute-cheaper --version
          execute-cheaper --help > /dev/null
