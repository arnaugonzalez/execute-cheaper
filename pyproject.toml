[build-system]
requires = ["hatchling>=1.24", "hatch-fancy-pypi-readme>=24"]
build-backend = "hatchling.build"

[project]
name = "execute-cheaper"
dynamic = ["version", "readme"]
description = "Plan with an expensive model, execute with cheap ones, verify independently."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Arnau González" }]
keywords = ["llm", "coding-agent", "claude-code", "codex", "deepseek", "openrouter", "verification", "cost"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Build Tools",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/arnaugonzalez/execute-cheaper"
Issues = "https://github.com/arnaugonzalez/execute-cheaper/issues"
Changelog = "https://github.com/arnaugonzalez/execute-cheaper/blob/main/CHANGELOG.md"

[project.scripts]
execute-cheaper = "execute_cheaper:main"

# PyPI does not resolve relative links: the README ships with them rewritten to GitHub URLs.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((docs/[^)]+)\)'
replacement = '](https://raw.githubusercontent.com/arnaugonzalez/execute-cheaper/main/\g<1>)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#)([^)]+)\)'
replacement = '](https://github.com/arnaugonzalez/execute-cheaper/blob/main/\g<1>)'

[tool.hatch.version]
path = "execute_cheaper.py"

[tool.hatch.build.targets.wheel]
only-include = ["execute_cheaper.py"]

[tool.hatch.build.targets.sdist]
include = ["execute_cheaper.py", "config.example.json", "tests/", "examples/", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # embedded fake CLI scripts
