[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "cheap-exec"
version = "0.1.0"
description = "Plan with an expensive model, execute with cheap ones, verify independently."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Arnau González" }]
keywords = ["llm", "coding-agent", "claude-code", "deepseek", "openrouter", "verification", "cost"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Build Tools",
]
dependencies = []

[project.scripts]
cheap-exec = "cheap_exec:main"

[tool.hatch.build.targets.wheel]
only-include = ["cheap_exec.py"]

[tool.hatch.build.targets.sdist]
include = ["cheap_exec.py", "config.example.json", "tests/", "examples/", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # embedded fake CLI scripts
